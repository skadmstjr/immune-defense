<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>면역 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>[hidden]{display:none!important}body{margin:0}</style>
<style>
/* Layout: game screen. Membrane-framed arena (blood vessel left, tissue field, wound right), top status bar, bottom dock = glucose bar + tabbed card hand + round action buttons. Deep body-interior world, single theme. */
:root{
  --bg:#2a0b14; --bg2:#3d1221; --flesh:#fbdadd; --flesh2:#f3b8c1; --skin:#fff4f5;
  --membrane:#c0465f; --membrane-d:#7d2238; --ink:#4a1626; --muted:#8c4a5c; --light:#ffe9ec;
  --gold:#e8920c; --goldbg:#ffcf4d; --golddk:#a8690a; --danger:#e8334f; --ok:#2f9e5c; --blue:#3d8fd1;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--light);font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:14px;box-sizing:border-box;
  background-image:radial-gradient(circle at 20% 0,#4a1527 0,transparent 45%),radial-gradient(circle at 90% 100%,#3a0f1e 0,transparent 50%)}
*{box-sizing:border-box}
.game{position:relative;max-width:1000px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--membrane-d);border:3px solid var(--membrane);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 12px}
.brand{font-family:var(--display);font-size:19px;color:var(--flesh)}
.stagepill{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:999px;padding:3px 14px 3px 3px;font-family:var(--display);font-size:15px;color:var(--flesh)}
.stagepill .lv{width:26px;height:26px;border-radius:50%;background:var(--goldbg);color:#6b3d05;display:grid;place-items:center;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;min-width:0}
.chip{font-family:var(--display);font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--skin);color:var(--muted);border:2px solid transparent}
.chip.on{color:var(--blue)}
.chip.warn{color:var(--danger)}
.thermo{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:3px 10px 3px 6px;font-family:var(--display);color:var(--flesh);font-size:13px}
.thermo .tube{width:70px;height:10px;border-radius:5px;background:#5c1c2e;overflow:hidden}
.thermo .tube i{display:block;height:100%;width:0;background:#7cc0f0;transition:width .3s,background .3s}
.thermo b{font-weight:400;font-size:15px;font-variant-numeric:tabular-nums;min-width:3.6em}
.thermo.hot .tube i{background:#ffb02e}.thermo.hot{color:#ffd27a}
.thermo.burn .tube i{background:#ff3b3b}.thermo.burn{color:#fff;background:#b3122c;animation:throb .6s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.07)}}
.game.hot .arena{box-shadow:0 0 0 3px #ff8a3d,0 0 26px rgba(255,110,40,.55)}
.game.burn .arena{box-shadow:0 0 0 4px #ff2a2a,0 0 40px rgba(255,30,30,.75);animation:burnglow .5s ease-in-out infinite}
.game.burn .topbar{background:#a3122a}
@keyframes burnglow{50%{box-shadow:0 0 0 4px #ff6a3d,0 0 60px rgba(255,60,30,.9)}}
.hpbox{display:flex;align-items:center;gap:6px}
.hearts{display:flex;gap:1px}
.hearts svg{width:15px;height:15px;display:block}
.hearts .empty path{fill:#5c1c2e}
.hpnum{font-family:var(--display);font-size:17px;color:var(--flesh);font-variant-numeric:tabular-nums;min-width:1.4em}
.arena{position:relative;border-inline:3px solid var(--membrane);background:#120409;overflow:hidden}
canvas#cv{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(560px,92%);background:rgba(255,244,245,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:2px solid rgba(255,207,77,.75);border-radius:18px;padding:9px 15px;font-size:14px;line-height:1.55;pointer-events:none;transition:opacity .3s;color:var(--ink);text-shadow:0 0 6px rgba(255,255,255,.9)}
.toast b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:17px;display:block;margin-bottom:2px}
.dock{background:var(--flesh);border:3px solid var(--membrane);border-radius:0 0 24px 24px;padding:10px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;color:var(--ink)}
.glurow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.hexa{width:50px;height:44px;flex:none;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--golddk);display:grid;place-items:center}
.hexa span{width:44px;height:38px;clip-path:inherit;background:var(--goldbg);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#6b3d05;font-variant-numeric:tabular-nums}
.glubar{flex:1;min-width:0;height:18px;border-radius:999px;background:#e8a3ae;border:3px solid var(--membrane);overflow:hidden;position:relative}
.glubar i{display:block;height:100%;background:var(--goldbg);transition:width .25s}
.glubar .tk{position:absolute;top:0;bottom:0;width:2px;background:rgba(125,34,56,.28)}
.glulbl{font-family:var(--display);font-size:14px;color:var(--muted);white-space:nowrap}
.handarea{min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding-left:10px}
.tab{font-family:var(--display);font-size:14px;padding:5px 14px 4px;border-radius:12px 12px 0 0;background:var(--flesh2);color:var(--muted);border:3px solid var(--membrane);border-bottom:0;cursor:pointer;margin-bottom:-3px;position:relative}
.tab[aria-selected="true"]{background:var(--skin);color:var(--ink);z-index:1}
.tab:focus-visible,.unit:focus-visible,.round:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.handwrap{background:var(--skin);border:3px solid var(--membrane);border-radius:16px;padding:0 8px 8px;min-width:0}
.hand{display:flex;gap:12px;overflow-x:auto;padding:24px 10px 10px;scrollbar-width:thin}
.unit{position:relative;flex:none;width:94px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px 8px;background:var(--light);border:3px solid var(--membrane);border-radius:16px;cursor:pointer;color:var(--ink);font-family:var(--display);box-shadow:0 5px 0 var(--membrane-d);transition:transform .28s cubic-bezier(.3,1.7,.5,1),box-shadow .2s,border-color .2s}
.unit canvas{width:60px;height:60px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 2px var(--flesh2)}
.unit .txt{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.unit .t{font-size:13px;line-height:1.15;text-align:center;word-break:keep-all}
.unit .lk{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.25;word-break:keep-all}
.unit .cost{position:absolute;top:-12px;left:-12px;width:32px;height:28px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--goldbg);color:#6b3d05;font-size:15px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.unit.poor .cost{background:#e3c3c9;color:var(--muted)}
.unit.poor canvas,.unit.off canvas{opacity:.55}
.unit:hover{transform:translateY(-4px)}
.unit.sel{transform:translateY(-16px) scale(1.14);border-color:var(--goldbg);box-shadow:0 0 0 5px rgba(255,207,77,.55),0 9px 0 var(--membrane-d);z-index:2}
.unit.fire{animation:fire .5s cubic-bezier(.3,1.7,.5,1)}
.unit.nope{animation:nope .35s}
@keyframes fire{0%{transform:scale(1)}30%{transform:translateY(-18px) scale(1.2);border-color:var(--goldbg)}100%{transform:none}}
@keyframes nope{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.unit.locked{background:#efe4e7;border-style:dashed;border-color:#c79aa6;box-shadow:none}
.unit.locked canvas{filter:grayscale(1);opacity:.4}
.unit.locked .t{color:#a58a93}
.rowlbl{font-family:var(--display);font-size:12.5px;color:var(--muted);padding:2px 10px 0;border-top:2px dashed var(--flesh2);margin:0 6px}
.hand.mem{padding-top:20px}
.unit.auto{cursor:help;background:#fff;border-color:#d79aa8;box-shadow:0 5px 0 #c58494}
.unit .cnt{position:absolute;top:-10px;right:-10px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--membrane);color:#fff;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.unit .cnt.zero{background:#d9b3bc}
.prog{height:5px;width:80%;border-radius:3px;background:#e2cfd4;overflow:hidden}.prog i{display:block;height:100%;background:#c79aa6}
.info{font-size:13.5px;color:var(--muted);line-height:1.5;padding:2px 6px 0;min-height:2.6em}
.actions{display:flex;align-items:flex-end;gap:10px}
.smalls{display:grid;grid-template-columns:repeat(2,54px);gap:8px}
.round{width:54px;height:54px;border-radius:50%;border:3px solid var(--membrane);background:var(--skin);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--display);font-size:11.5px;color:var(--ink);box-shadow:0 4px 0 var(--membrane-d);cursor:pointer;padding:0;transition:transform .1s,box-shadow .1s}
.round svg{width:20px;height:20px}
.round:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--membrane-d)}
.round:disabled{opacity:.45;cursor:default}
.round.sel{background:var(--danger);color:#fff;border-color:var(--membrane-d)}
.round.go{width:96px;height:96px;background:var(--goldbg);border-color:var(--golddk);box-shadow:0 6px 0 var(--golddk);font-size:17px;color:#6b3d05}
.round.go svg{width:34px;height:34px}
.round.go:not(:disabled){animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,11,20,.78);padding:16px;z-index:5;border-radius:24px}
.card{background:var(--flesh);border:3px solid var(--membrane);border-radius:24px;padding:22px 24px;max-width:500px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 var(--membrane-d);color:var(--ink)}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-wrap:balance;color:var(--membrane-d)}
.card .eyebrow{font-family:var(--display);font-size:14px;color:var(--gold)}
.card p{margin:0;line-height:1.65;color:var(--muted)}
.card ul{margin:0;padding-left:18px;line-height:1.7;color:var(--muted);font-size:14px}
.btn{align-self:flex-start;font-family:var(--display);font-size:18px;background:var(--goldbg);color:#6b3d05;border:0;border-radius:999px;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 var(--golddk)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--golddk)}
.bookcard{max-width:900px;height:100%}
.booktabs{display:flex;gap:4px;border-bottom:3px solid var(--membrane);padding-left:6px}
.booktabs .tab{margin-bottom:-3px}
.bookpage{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0;flex:1;padding-right:4px}
.bookrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding-top:12px;border-top:2px dashed var(--flesh2)}
.bookrow:first-child{border-top:0;padding-top:4px}
.rowhead b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--membrane-d)}
.rowhead span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block;margin-top:2px}
.rowcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.tag{font-family:var(--display);font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--flesh);color:var(--membrane-d)}
.tag.how{background:#fff3d6;color:#8a5a06}
.found{font-style:normal;font-size:11px;background:var(--ok);color:#fff;border-radius:999px;padding:1px 7px;vertical-align:2px}
.entry dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;line-height:1.45}
.entry dt{font-family:var(--display);color:var(--gold)}
.entry dd{margin:0;color:var(--ink)}
@media (max-width:680px){.bookrow{grid-template-columns:minmax(0,1fr)}}
.entry{display:flex;gap:10px;align-items:flex-start;background:var(--skin);border:2px solid var(--flesh2);border-radius:14px;padding:8px}
.entry canvas{width:56px;height:56px;flex:none;background:#fff;border-radius:50%}
.entry b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.entry .how{font-size:12px;color:var(--gold);font-family:var(--display)}
.entry p{font-size:12.5px;line-height:1.5;margin:2px 0 0}
@media (max-width:680px){
  .dock{grid-template-columns:minmax(0,1fr)}
  .actions{order:-1;grid-column:1/-1;justify-content:flex-end}
  .smalls{grid-template-columns:repeat(4,54px)}
  .thermo .tube{width:44px}#tempState{display:none}
  .round.go{width:64px;height:64px;font-size:13px}.round.go svg{width:24px;height:24px}
  .brand{display:none}.chips{order:3;margin-left:0;width:100%}
  .hpbox{margin-left:auto}.hearts svg{width:12px;height:12px}
  .unit{width:84px}.unit canvas{width:52px;height:52px}
}
@media (max-width:680px){.toast{font-size:12.5px;padding:7px 11px;top:6px}.toast b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.unit,.round{transition:none}.unit.fire,.unit.nope,.round.go:not(:disabled){animation:none}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="topbar">
    <span class="brand">면역 디펜스</span>
    <div class="stagepill"><span class="lv" id="stageNo">1</span><span id="stageName">피부 상처</span></div>
    <div class="thermo" id="thermo" title="체온"><div class="tube"><i id="thermoFill"></i></div><b id="tempNum">36.8℃</b><span id="tempState">정상</span></div>
    <div class="chips" id="chips"></div>
    <div class="hpbox" aria-label="몸 체력"><div class="hearts" id="hearts"></div><b class="hpnum" id="hp">10</b></div>
  </div>

  <div class="arena">
    <canvas id="cv" width="960" height="500" aria-label="게임 판"></canvas>
    <div class="toast" id="toast" style="opacity:0"></div>
  </div>

  <div class="dock">
    <div class="glurow">
      <div class="hexa"><span id="glu">0</span></div>
      <div class="glubar" id="glubar"><i id="gluFill"></i></div>
      <span class="glulbl">포도당</span>
    </div>
    <div class="handarea">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="barrier" id="tab-barrier">1차 방어선</button>
        <button class="tab" role="tab" data-tab="unit" id="tab-unit">면역세포</button>
        <button class="tab" role="tab" data-tab="auto" id="tab-auto">자동 출동</button>
      </div>
      <div class="handwrap">
        <div class="hand" id="barrierRow"></div>
        <div id="unitRow" hidden>
          <div class="hand" id="unitHand"></div>
          <div class="rowlbl">기억세포 · 같은 유형을 10번 물리치면 열린다</div>
          <div class="hand mem" id="memHand"></div>
        </div>
        <div class="hand" id="autoRow" hidden></div>
        <div class="info" id="info">면역세포 카드를 누르면 혈관에서 바로 출동한다.</div>
      </div>
    </div>
    <div class="actions">
      <div class="smalls">
        <button class="round" id="antiBtn" title="항생제 (1회)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.2 7.9l5.6 8.2"/></svg>항생제</button>
        <button class="round" id="pyBtn" title="해열제 (피버 타임에 1회)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4a2 2 0 014 0v9.3a4 4 0 11-4 0z"/><path d="M12 9v6"/><path d="M17.5 5.5h4M17.5 8.5h3"/></svg>해열제</button>
        <button class="round" id="removeBtn" title="제거 모드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>제거</button>
        <button class="round" id="bookBtn" title="면역 도감"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5C9.5 18 6.5 18 4 19z"/><path d="M12 6v13.5"/></svg>도감</button>
      </div>
      <button class="round go" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><span id="startLbl">시작</span></button>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>
</div>

<script>
const COLS=9, ROWS=5, CELL=100, LEFT=60, W=960, H=500;
const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);

// ---------- biology data ----------
const STRAINS={
  A:{name:'세균 A형',color:'#e5484d',shape:'circle',divide:1,dodge:1,
    trait:'편모로 헤엄쳐 다가오는 식세포를 요리조리 피하고, 이분법으로 계속 수를 늘린다. 항체가 붙으면 편모가 묶여 더는 못 피한다.'},
  B:{name:'세균 B형',color:'#3d8fd1',shape:'tri',capsule:1,divide:1,intracell:1,
    trait:'두꺼운 협막(캡슐)에 싸여 미끄러워서 식세포가 잘 못 잡는다. 먹혀도 일부는 소화되지 않고 대식세포 안에서 살아남아 대식세포를 감염시킨다(세포 내 기생). 항체가 붙어 있으면(옵소닌화) 제대로 먹히고 소화된다.'},
  C:{name:'독소 세균 C형',color:'#2f9e5c',shape:'square',
    trait:'독소를 뿜어 주변 면역세포를 해친다. 항체가 독소에 붙어 중화한다.'},
  D:{name:'바이러스 D형',color:'#e39a0c',shape:'star',virus:1,spd:1.35,hide:5,
    trait:'전파가 빠른 바이러스. 빠르게 움직이고 5초 만에 세포 속으로 숨는다.'},
  E:{name:'바이러스 E형',color:'#0f9f9f',shape:'diamond',virus:1,hide:6,mhc:1,
    trait:'감염시킨 세포 표면의 MHC를 숨겨서 세포독성 T림프구가 알아보지 못한다. 대신 MHC가 사라진 세포를 알아보는 NK세포가 2배로 강하다.'},
  F:{name:'변이 바이러스 F형',color:'#c03fa8',shape:'cross',virus:1,hide:6,
    trait:'항원이 바뀐 새 바이러스다. 예전 기억이 통하지 않아 처음부터 다시 정체를 밝혀야 한다.'},
  P:{name:'꽃가루',color:'#d9a400',shape:'flower',harmless:1,
    trait:'병원체가 아니라 해롭지 않은 꽃가루다. 아무것도 공격하지 않는다. 그런데 면역계가 이걸 적으로 착각하면 알레르기가 생긴다.'}
};

function newState(i,prev){
  const st=STAGES[i];const spawns=[];
  st.spawns.forEach(([a,b,iv,k,s])=>{for(let t=a;t<=b;t+=iv*(0.85+Math.random()*.3))spawns.push({t,k,s,lane:Math.floor(Math.random()*ROWS)})});
  spawns.sort((x,y)=>x.t-y.t);
  return {stage:i,phase:'setup',t:0,glu:st.start,hp:prev?prev.hp:10,grid:Array.from({length:ROWS},()=>Array(COLS).fill(null)),
    units:[],plasmaPools:[],hist:[],debris:[],picked:null,enemies:[],abs:[],shots:[],zaps:[],fx:[],waves:[],spawns,events:st.events.map(e=>({t:e[0],k:e[1]})),

// ---------- drawing ----------
function eyes(x,y,s,dir,mood){
  const ox=dir*s*.12;
  [-1,1].forEach(i=>{
    const ex=x+i*s*.25+ox, ey=y-s*.06;
    if(mood==='dizzy'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,s*.15,0,7);ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle='#4a2338';ctx.beginPath();for(let a=0;a<9;a+=.3)ctx.lineTo(ex+Math.cos(a)*a*s*.013,ey+Math.sin(a)*a*s*.013);ctx.stroke();return;}
    ctx.fillStyle=mood==='mys'?'#fff':'#3b1a2e';ctx.beginPath();ctx.ellipse(ex,ey,s*.13,s*.155,0,0,7);ctx.fill();
    ctx.fillStyle=mood==='mys'?'#3b1a2e':'#fff';ctx.beginPath();ctx.arc(ex+s*.04*dir,ey-s*.02,s*(mood==='mys'?.06:.05),0,7);ctx.fill();
    if(mood!=='mys'){ctx.beginPath();ctx.arc(ex-s*.04,ey+s*.05,s*.022,0,7);ctx.fill();}
    if(mood==='mean'){ctx.strokeStyle='#3b1a2e';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();
      const inner=i*dir<0;ctx.moveTo(ex-s*.13,ey-s*.24+(inner?0:-4)*i*dir*-1);ctx.lineTo(ex+s*.13,ey-s*.24+(inner?0:4)*i*dir*-1);ctx.stroke();}
    else if(mood!=='mys'){ctx.fillStyle='rgba(255,120,150,.45)';ctx.beginPath();ctx.ellipse(ex+i*s*.1,ey+s*.2,s*.09,s*.05,0,0,7);ctx.fill();}
  });
  if(mood==='mys')return;
  ctx.strokeStyle='#3b1a2e';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
  const mx=x+ox, my=y+s*.16;
  if(mood==='mean'){ctx.moveTo(mx-s*.1,my+s*.03);ctx.quadraticCurveTo(mx,my-s*.04,mx+s*.1,my+s*.03);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(mx-s*.06,my);ctx.lineTo(mx-s*.02,my);ctx.lineTo(mx-s*.04,my+s*.06);ctx.fill();}
  else{ctx.moveTo(mx-s*.08,my);ctx.quadraticCurveTo(mx-s*.04,my+s*.06,mx,my);ctx.quadraticCurveTo(mx+s*.04,my+s*.06,mx+s*.08,my);ctx.stroke();}
}
function heart(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*1.4,y,x-r*.7,y-r,x,y-r*.35);ctx.bezierCurveTo(x+r*.7,y-r,x+r*1.4,y,x,y+r*.9);ctx.fill();}

      if(th){const opts=[e.lane-1,e.lane+1].filter(l=>l>=0&&l<ROWS);const l=opts[Math.floor(Math.random()*opts.length)];e.lane=l;e.dodgeCd=2.2;S.fx.push({x:LEFT+e.x*CELL,y:e.ry*CELL+50,t:.3,kind:'dust'});}}
    // viruses are carried around by body fluid
    if(e.k==='virus'){e.drift=(e.drift||0)+dt;if(e.drift>2.4){e.drift=0;if(Math.random()<.35){const l=e.lane+(Math.random()<.5?-1:1);if(l>=0&&l<ROWS)e.lane=l;}}}
    // binary fission
    if(T.divide&&e.k==='bact'&&(e.gen||0)<1&&S.enemies.length<40){e.divT=(e.divT||0)+dt*((S.temp||0)>=37.8?.5:1);if(e.divT>=13){e.divT=0;e.gen=(e.gen||0)+1;
      const ch={...e,id:eid++,x:e.x+.18,lane:Math.max(0,Math.min(ROWS-1,e.lane+(Math.random()<.5?0:(Math.random()<.5?-1:1)))),hp:ENEMIES.bact.hp,divT:0};born2.push(ch);
      S.fx.push({x:LEFT+e.x*CELL,y:e.ry*CELL+50,t:.2,kind:'place',c:'#e5484d'});if(!S.flags.divide&&S.revealed[e.s]){S.flags.divide=1;note('divide');}}}
    let sp=d.speed*(T.spd||1);if((S.temp||0)>=37.8)sp*=.72;if(e.opT>0)sp*=.5;if(e.inPlasma)sp*=.6;e.inPlasma=0;e.slowT=0;
    if(g){
      if(g.k==='mucus'){sp*=.5;e.slowT=1;}
      if(g.k==='lyso'&&(e.k==='bact'||e.k==='toxin'))hurt(e,9*dt);
      if(g.k==='cilia'){e.pushCd-=dt;if(e.pushCd<=0){e.pushCd=3;e.x=Math.min(9.6,e.x+.6);}}
    }
    if(e.k==='toxin'&&!(e.opT>0)){for(const u of S.units)if(Math.hypot(u.x-e.x,u.y-e.lane)<1.15)u.hp-=5*dt;}
    const b=e.k==='pollen'?null:blockerFor(e);
    const isB=e.k==='bact'||e.k==='toxin';
    if(b){if(!(isB&&UNITS[b.k])){b.hp-=d.dps*dt;if(UNITS[b.k])b.hitT=.12;}}else e.x-=sp*dt;
    // bacteria actively attack nearby immune cells with toxins and enzymes
    e.lunge=Math.max(0,(e.lunge||0)-dt);
    if(isB){e.biteCd=(e.biteCd||0)-dt;
      if(e.biteCd<=0){let tg=null,bd=.75;for(const u of S.units){const dd=Math.hypot(u.x-e.x,u.y-(e.ry??e.lane));if(dd<bd){bd=dd;tg=u;}}
        if(tg){const dmg=e.k==='toxin'?5:5;tg.hp-=dmg;tg.hitT=.3;e.biteCd=.9;e.lunge=.22;e.ldx=Math.sign(tg.x-e.x)||-1;e.ldy=Math.sign(tg.y-e.lane);
          S.fx.push({x:LEFT+tg.x*CELL,y:tg.y*CELL+28,t:0,kind:'dmg',n:dmg});S.fx.push({x:LEFT+(tg.x+e.x)/2*CELL,y:((tg.y+(e.ry??e.lane))/2)*CELL+50,t:.2,kind:'bite'});
          if(!S.flags.bite){S.flags.bite=1;note('bite');}}}}
    if(e.x<-.2&&e.k==='pollen'){e.dead=1;continue;}
    if(e.x<-.2){e.dead=1;S.hp-=e.k==='mutant'?5:1;S.fx.push({x:LEFT,y:e.lane*CELL+50,t:0,kind:'hit'});}
  }
  S.enemies.push(...born2);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const g=S.grid[r][c];if(g&&g.hp<=0){S.grid[r][c]=null;S.fx.push({x:LEFT+c*CELL+50,y:r*CELL+50,t:0,kind:'hit'});}}

  // immune cells
  const helper=hasHelper(), born=[], born2b=[];
  const makeUnit=(k,s,x,y,extra={})=>{const d=UNITS[k];const u={k,s,x,y,hx:x,hy:Math.round(y),hp:d.hp,maxhp:d.hp,cd:0,born:S.t,tick:0,face:1,moving:0,ordered:false,active:true,actT:0,kills:0,state:'seek',...extra};born.push(u);return u;};
  for(const u of S.units){
    const def=UNITS[u.k];
    u.tick=Math.max(0,u.tick-dt);u.cd-=dt*rateMul(u);
    u.hitT=Math.max(0,(u.hitT||0)-dt);u.hasT=0;
    if(u.hp<=0||(def.life&&S.t-u.born>def.life)){u.dead=1;S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:u.infected?'hit':'pop'});
      if(u.infected){const l=Math.max(0,Math.min(ROWS-1,Math.round(u.y)));for(let i=0;i<3;i++)born2b.push(['bact',u.infected,Math.max(0,Math.min(ROWS-1,l+(i-1))),Math.max(.6,u.x+.1)]);if(!S.flags.macroBurst){S.flags.macroBurst=1;note('macroBurst');}}
      continue;}
    // B and cytotoxic T wait for the helper's cytokine signal
    if(!u.active){
      if(helper){u.actT+=dt;if(u.actT>=1.5){u.active=true;u.cd=1;S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'birth'});
        if(u.k==='bcell'&&!S.flags.plasma){S.flags.plasma=1;note('plasma');}
        if(u.k==='tc'&&!S.flags.tcAct){S.flags.tcAct=1;note('tcAct');}}}
      idle(u,dt,.5,2.2);continue;
    }
    if(u.k==='macro'&&u.infected){
      // intracellular bacteria: sick macrophage can't fight; helper T nearby activates it (IFN-gamma) to kill them
      u.hp-=5*dt;u.hitT=Math.max(u.hitT,.05);
      const h=S.units.find(v=>v.k==='helper'&&Math.hypot(v.x-u.x,v.y-u.y)<1.6);
      if(h){u.cureT=(u.cureT||0)+dt;if(u.cureT>=2.5){u.infected=null;u.cureT=0;u.activated=1;u.tick=.4;S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'place',c:'#3d8fd1'});if(!S.flags.macroCure){S.flags.macroCure=1;note('macroCure');}}}
      else u.cureT=Math.max(0,(u.cureT||0)-dt*.5);
      if(u.ordered)moveToward(u,u.hx,u.hy,def.sp*.6,dt);else idle(u,dt,.6,6);
    } else if(u.k==='macro'){
      // no long-range sensing: wanders until a pathogen is right next to it
      const db=S.debris.find(d=>Math.hypot(d.x-u.x,d.y-u.y)<.9);
      if(db){db.eaten=1;u.tick=.3;reveal(db.s);}
      const t=nearest(u,e=>EXTRA[e.k]&&Math.hypot(e.x-u.x,e.lane-u.y)<.95);
      if(t){if(approach(u,t,.55,dt)&&u.cd<=0){u.cd=def.rate;u.tick=.15;
          let m={bact:1,toxin:.6,virus:1,mutant:.15,pollen:1}[t.k];if(STRAINS[t.s].capsule&&!(t.opT>0))m*=.5;if(t.opT>0)m*=2;if(u.activated)m*=1.5;const was=t.dead;hurt(t,def.dmg*m,'macro');
          if(!was&&t.dead&&STRAINS[t.s].intracell&&!(t.opT>0)&&!u.activated&&Math.random()<.25){u.infected=t.s;u.cureT=0;if(!S.flags.macroInf){S.flags.macroInf=1;note('macroInf');}}}}
      else idle(u,dt);
    } else if(u.k==='neut'){
      // recruited by the mast cell's alarm: crawls along the chemical trail to bacteria around the alarm spot
      // only goes after the bacteria the mast cell shouted about; leaves 5 s after they are gone
      const t=nearest(u,e=>u.targets.includes(e));
      if(t){u.doneT=0;if(approach(u,t,.55,dt)&&u.cd<=0){u.cd=def.rate;u.tick=.15;
          let m=t.k==='bact'?1:t.k==='pollen'?1:.6;if(STRAINS[t.s].capsule&&!(t.opT>0))m*=.5;if(t.opT>0)m*=2;hurt(t,def.dmg*m,'neut');}}
      else{u.doneT=(u.doneT||0)+dt;u.moving=0;if(u.doneT>=5){u.dead=1;S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'pop'});}}
    } else if(u.k==='nk'){
      const t=nearest(u,e=>e.k==='infected');
      if(t){if(approach(u,t,.7,dt)&&u.cd<=0){u.cd=def.rate;u.tick=.15;hurt(t,def.dmg*(STRAINS[t.s].mhc?2:1),'nk');S.zaps.push({x1:u.x,y1:u.y,x2:t.x,y2:t.lane,t:.18,c:'255,160,60'});}}
      else idle(u,dt);
    } else if(u.k==='tc'){
      const t=STRAINS[u.s].mhc?null:(nearest(u,e=>e.k==='infected'&&e.s===u.s)||nearest(u,e=>e.k==='virus'&&e.s===u.s));
      if(STRAINS[u.s].mhc&&!S.flags.mhcHide){S.flags.mhcHide=1;note('mhcHide');}
      if(t&&t.k==='infected'){if(approach(u,t,.7,dt)&&u.cd<=0){u.cd=def.rate;u.tick=.15;hurt(t,def.dmg,'tc');S.zaps.push({x1:u.x,y1:u.y,x2:t.x,y2:t.lane,t:.2,c:'240,80,100'});}}
      else if(t)approach(u,t,1.4,dt);
      else idle(u,dt);
    } else if(u.k==='bcell'||u.k==='memory'){
      // activated B cell (or memory B cell) stays back, divides and differentiates into plasma cells
      const mine=S.units.filter(v=>v.k==='plasma'&&v.parent===u&&!v.dead).length;
      const max=u.k==='memory'?4:2, every=u.k==='memory'?2.5:7;
      const t=nearest(u,e=>e.s===u.s);
      if(u.ordered)moveToward(u,u.hx,u.hy,def.sp,dt);
      else if(t)moveToward(u,Math.max(.6,Math.min(t.x-2.5,3.5)),t.lane,def.sp,dt);
      else idle(u,dt,.6,2.5);
      u.div=(u.div||0)+dt;
      if(u.div>=every&&mine<max){u.div=0;u.tick=.3;makeUnit('plasma',u.s,u.x+.2,u.y,{parent:u,boost:u.k==='memory'?1.5:1});
        S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'birth'});}
    } else if(u.k==='plasma'){
      // plasma cell: go to the matching pathogens, release antibodies, then move on
      if(u.state==='move'){if(moveToward(u,u.wx,u.wy,def.sp,dt)||u.cd<=0)u.state='seek';}
      else{
        const t=nearest(u,e=>e.s===u.s&&EXTRA[e.k]);
        if(t)u.doneT=0;
        else{u.doneT=(u.doneT||0)+dt;if(u.doneT>=4){u.dead=1;S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'pop'});}}
        if(t){if(approach(u,t,1.8,dt)&&u.cd<=0){if(releaseAntibodies(u,8,def.dmg*u.boost)){u.cd=def.rate;u.state='move';
              u.wx=Math.max(.6,Math.min(8.4,u.x+(Math.random()-.5)*3));u.wy=Math.max(0,Math.min(ROWS-1,u.y+(Math.random()<.5?-1.2:1.2)));}}}
        else idle(u,dt);
      }
    } else if(u.k==='mast'){
      // tissue-resident: drifts slowly; when bacteria come close it sounds the alarm
      const t=nearest(u,e=>(e.k==='bact'||e.k==='toxin'||(e.k==='pollen'&&S.flags.sens))&&Math.hypot(e.x-u.x,e.lane-u.y)<1.6);
      if(u.ordered)moveToward(u,u.hx,u.hy,def.sp,dt);
      else if(t){u.moving=0;u.face=t.x>=u.x?1:-1;}
      else idle(u,dt,.6,6);
      u.alarm=Math.max(0,(u.alarm||0)-dt);
      if(t&&u.cd<=0){
        const allergic=t.k==='pollen';u.cd=allergic?4:8;u.alarm=1.6;u.tick=.4;
        if(allergic){S.allergy=Math.max(S.allergy||0,9);if(!S.flags.allergy){S.flags.allergy=1;note('allergy');}}
        S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'shout'});
        for(let i=0;i<14;i++){const a=Math.random()*6.28,v=.6+Math.random()*1.2;S.hist.push({x:u.x,y:u.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0});}
        S.plasmaPools.push({x:u.x+.2,y:u.y,t:0,life:9});
        const lane=Math.round(u.y);
        const targets=S.enemies.filter(e=>!e.dead&&(allergic?e.k==='pollen':(e.k==='bact'||e.k==='toxin'))&&Math.hypot(e.x-u.x,e.lane-u.y)<2);
        targets.forEach(e=>e.alarmT=8);
        for(let i=0;i<2;i++){const n=makeUnit('neut',null,.05+i*.15,lane+(i-.5)*.3,{targets});n.hx=u.x;n.hy=u.y;}
        S.fx.push({x:LEFT,y:lane*CELL+50,t:0,kind:'birth'});
        if(!S.flags.alarm){S.flags.alarm=1;note('alarm');}
      }
    } else if(u.k==='helper'){
      const team=S.units.filter(v=>v.k==='bcell'||v.k==='tc');
      const sick=S.units.filter(v=>v.k==='macro'&&v.infected).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];
      if(u.ordered)moveToward(u,u.hx,u.hy,def.sp,dt);
      else if(sick){moveToward(u,sick.x-.6,sick.y,def.sp*1.3,dt);if(Math.hypot(sick.x-u.x,sick.y-u.y)<1.6&&Math.random()<dt*2)S.fx.push({kind:'signal',x1:u.x,y1:u.y,v:sick,t:0});}
      else if(team.length){const cx=team.reduce((a,v)=>a+v.x,0)/team.length,cy=team.reduce((a,v)=>a+v.y,0)/team.length;moveToward(u,Math.max(.6,cx-1.2),cy,def.sp,dt);}
      else idle(u,dt,.6,2);
      if(team.length||sick)u.hasT=1;
      u.sig=(u.sig||0)+dt;if(u.sig>1.4&&team.length){u.sig=0;u.worked=1;for(const v of team)S.fx.push({kind:'signal',x1:u.x,y1:u.y,v,t:0});}
      if(sick)u.worked=1;
    }
    // job done: after a while with nothing to do, the cell withdraws (contraction phase)
    if(S.phase==='wave'&&!u.infected&&u.k!=='neut'&&u.k!=='plasma'){
      if(u.tick>0||u.hasT){if(u.tick>0)u.worked=1;u.idleT=0;}
      else u.idleT=(u.idleT||0)+dt;
      if(u.worked&&u.idleT>9){u.dead=1;S.fx.push({x:LEFT+u.x*CELL,y:u.y*CELL+50,t:0,kind:'leave'});if(!S.flags.leave){S.flags.leave=1;note('leave');}}
    }
  }
  S.units.push(...born);
  for(const [k,st,l,x] of born2b)spawn(k,st,l,x);
  S.debris.forEach(d=>d.t+=dt);S.debris=S.debris.filter(d=>!d.eaten&&d.t<14&&!S.revealed[d.s]);
  // leaked blood plasma: slows pathogens, complement proteins punch holes in bacteria
  for(const p of S.plasmaPools){p.t+=dt;const r=Math.min(1.2,.3+p.t*1.5);
    for(const e of S.enemies){if(Math.hypot(e.x-p.x,e.lane-p.y)<r){e.slowT=1;e.inPlasma=1;if(e.k==='bact'||e.k==='toxin')hurt(e,6*dt,'complement');}}}
  S.plasmaPools=S.plasmaPools.filter(p=>p.t<p.life);
  for(const h of S.hist){h.t+=dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.vx*=.96;h.vy*=.96;}
  S.hist=S.hist.filter(h=>h.t<1.4);
  if(S.picked&&S.picked.dead)S.picked=null;
  S.units=S.units.filter(u=>!u.dead);
  for(let i=0;i<S.units.length;i++)for(let j=i+1;j<S.units.length;j++){const a=S.units[i],b=S.units[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<.45&&d>1e-4){const p=(.45-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p;}}
  for(const u of S.units){u.y=Math.max(0,Math.min(ROWS-1,u.y));u.x=Math.max(.3,Math.min(COLS-.3,u.x));}

  // antibodies home in on their antigen
  for(const h of S.hist){const a=1-h.t/1.4;ctx.save();ctx.globalAlpha=a;circ(LEFT+h.x*CELL,h.y*CELL+50,3.5,'#9b4dbf');ctx.restore();}
  for(const a of S.abs){
    a.life-=dt;
    if(!a.t||a.t.dead||!EXTRA[a.t.k]){a.t=null;let bd=2.5;for(const e of S.enemies){if(e.dead||e.s!==a.s||!EXTRA[e.k])continue;const d=Math.hypot(e.x-a.x,e.lane-a.y);if(d<bd){bd=d;a.t=e;}}}
    if(a.t){const dx=a.t.x-a.x,dy=a.t.lane-a.y,d=Math.hypot(dx,dy);
      a.vx+=(dx/d*6-a.vx)*Math.min(1,dt*6);a.vy+=(dy/d*6-a.vy)*Math.min(1,dt*6);
      if(d<.22){hurt(a.t,a.dmg,'ab');a.t.opT=6;a.dead=1;}}
    a.x+=a.vx*dt;a.y+=a.vy*dt;
    if(a.life<=0||a.x<-.5||a.x>10)a.dead=1;
  }
  S.abs=S.abs.filter(a=>!a.dead);
  S.enemies=S.enemies.filter(e=>!e.dead);
  S.zaps.forEach(z=>z.t-=dt);S.zaps=S.zaps.filter(z=>z.t>0);
  S.waves.forEach(w=>w.t+=dt);S.waves=S.waves.filter(w=>w.t<.6);
  S.fx.forEach(f=>f.t+=dt);S.fx=S.fx.filter(f=>f.t<(f.kind==='shout'?1.2:.8));

  if(S.hp<=0){S.phase='over';showOver();}
  else if(!S.spawns.length&&!S.enemies.length&&S.t>S.lastSpawn){S.phase='clear';showClear();}
}

    ctx.save();ctx.globalAlpha=.55*a;ctx.fillStyle='#ffe38c';ctx.beginPath();for(let k=0;k<=6.3;k+=.25){const rr=r*(.92+.08*Math.sin(k*5+time*2));ctx.lineTo(px+Math.cos(k)*rr,py+Math.sin(k)*rr*.8);}ctx.closePath();ctx.fill();
    ctx.globalAlpha=a;for(let i=0;i<7;i++){const k=i*.9+time*.5;circ(px+Math.cos(k)*r*.55,py+Math.sin(k*1.3)*r*.4,2.6,'#d9a020');}
    drawUnit('serum',px,py-6,34,time,a);ctx.restore();}
  for(const d of S.debris){const px=LEFT+d.x*CELL,py=d.y*CELL+56;ctx.save();ctx.globalAlpha=Math.min(1,(14-d.t)/2);for(let i=0;i<6;i++)circ(px+Math.cos(i*1.7)*14,py+Math.sin(i*2.3)*8,4+i%3,'#9c8fa3');marker(px,py-14,6,d.s,true);ctx.restore();}
  for(const w of S.waves){ctx.strokeStyle=`rgba(47,158,92,${1-w.t/.6})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(LEFT+w.x*CELL,w.y*CELL+50,20+w.t*120,0,7);ctx.stroke();}
  const sorted=[...S.units].sort((a,b)=>a.y-b.y);
  for(const u of sorted){
    const def=UNITS[u.k], x=LEFT+u.x*CELL+(u.hitT>0?Math.sin(time*70)*3:0), y=u.y*CELL+50;
    let fade=def.life?Math.min(1,(def.life-(S.t-u.born))/5+.3):1;if(u.worked&&u.idleT>6)fade=Math.min(fade,1-(u.idleT-6)/3*.6);
    if(u===S.picked){ctx.strokeStyle='#3d8fd1';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y+30,30,10,0,0,7);ctx.stroke();}
    const drawK=u.k;
    ctx.save();
    const wob=u.moving?Math.sin(time*16)*.06:0;
    ctx.translate(x,y);ctx.rotate(wob);if(u.tick)ctx.scale(1.14,.9);{const ps=popScale(u.pt)*(u===S.picked?1.15:1);ctx.scale(ps,ps);}if(u.face<0)ctx.scale(-1,1);ctx.translate(-x,-y);

  const st=STAGES[S.stage];
  const tips=[
    ['오른쪽 상처로 병원체가 몰려온다. 왼쪽 혈관에 닿으면 온몸으로 퍼져 체력(하트)이 깎인다.','준비 단계에서 1차 방어선 카드를 고르고 반짝이는 칸을 눌러 깐다. 웨이브가 시작되면 더 못 깐다.','대식세포(백혈구)는 멀리 있는 세균을 못 알아챈다. 돌아다니다 바로 옆에 와야 먹는다.','비만세포는 세균이 다가오면 소리치며 히스타민을 뿜는다. 그러면 혈장이 새어 나오고 호중구가 몰려온다. 호중구와 혈장은 직접 부를 수 없다.','처음 보는 병원체는 까맣다. 대식세포가 하나를 먹으면 그 유형 전체의 정체가 드러난다.','T림프구는 정체가 드러난 항원이 있어야 열린다. 세포독성 T림프구는 바이러스 항원이 드러나야 쓸 수 있다.','중간에 피버 타임이 온다. 적당한 열은 병원체를 약하게 하지만, 세포를 너무 많이 풀면 40℃를 넘어 우리 편도 지친다. 위의 체온계를 보자.'],
    ['면역세포 탭의 B림프구는 드러난 항원 하나를 맡는다. 머리 위 표식이 담당 항원이다.','까만 병원체 중엔 해롭지 않은 꽃가루도 섞여 있다. 정체를 밝힌 상태로 보조 T림프구가 있으면 몸이 꽃가루를 적으로 기억해 버린다(감작).','보조 T림프구가 판에 있어야 B림프구가 활성화되어 형질세포를 만든다. 항체를 뿌리는 건 형질세포다.','같은 유형을 10번 물리치면 그 유형의 기억세포가 열린다.'],
    ['바이러스는 노란 고리가 다 차면(6초) 세포 속으로 숨어 감염세포가 되고, 감염세포는 그 자리에서 바이러스를 복제해 내보내다 결국 터진다.','NK세포는 아무 감염세포나, 세포독성 T림프구는 맡은 항원의 감염세포만 공격한다.','마지막에 새 항원을 가진 변이 바이러스가 온다.','중간에 꽃가루 시즌이 온다. 림프절에서 꽃가루에 감작됐다면 알레르기 반응이 일어난다.']
  ][S.stage];
  overlay(`<div class="card"><div class="eyebrow">스테이지 ${S.stage+1} / ${STAGES.length}</div><h2>${st.name}</h2><p>${st.goal}</p>
  <ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul><button class="btn" id="goBtn">준비하기</button></div>`);
  $('goBtn').onclick=()=>{hideOverlay();setTab('barrier');};
  $('goBtn').focus();
}
function showClear(){
  const last=S.stage===STAGES.length-1;
  overlay(`<div class="card"><div class="eyebrow">방어 성공</div><h2>${last?'모든 감염을 막아냈다':st().name+' 방어 완료'}</h2>
  <p>${last?'정체불명의 병원체를 식세포가 먹고, 항원 제시로 정체를 밝히고, 항체와 세포독성 T림프구로 처리하고, 기억세포까지 남겼다. 실제 몸의 면역도 이 순서로 이어진다.':'남은 체력 '+S.hp+'. 다음 부위로 이동한다. 드러난 항원과 기억세포는 그대로 남는다.'}</p>
  <button class="btn" id="nextBtn">${last?'처음부터 다시':'다음 스테이지'}</button></div>`);
  $('nextBtn').onclick=()=>{S=last?newState(0):newState(S.stage+1,S);lastHp=null;buildTray();showIntro();};
  refreshTray();
}
function showOver(){
  overlay(`<div class="card"><div class="eyebrow">감염 확산</div><h2>방어선이 무너졌다</h2>
  <p>정체를 빨리 밝힐수록 특이적 면역을 일찍 쓸 수 있다. 세균은 식세포와 항체, 바이러스는 숨기 전엔 항체로, 숨은 뒤엔 NK세포와 세포독성 T림프구로 막아야 한다.</p>
  <button class="btn" id="retryBtn">이 스테이지 다시</button></div>`);
  $('retryBtn').onclick=()=>{const keep=S.stage>0?S.carry:null;S=newState(S.stage,keep);lastHp=null;buildTray();showIntro();};
  refreshTray();
}
const BOOK_AG=[
  {row:'세균',sub:'세포 밖에서 스스로 분열해 늘어난다',items:[
    {k:'bact',s:'A',tags:['편모 회피','이분법'],where:'1·2·3스테이지',weak:'항체가 붙으면 편모가 묶여 못 피한다. 형질세포로 묶고 식세포로 먹는다.'},
    {k:'bact',s:'B',tags:['협막','세포 내 기생','이분법'],where:'1·2스테이지',weak:'항체를 붙여(옵소닌화) 식세포가 먹게 한다. 감염된 대식세포는 보조 T림프구로 활성화한다.'},
    {k:'toxin',s:'C',tags:['독소'],where:'2스테이지',weak:'형질세포의 항체가 독소를 중화한다.'}]},
  {row:'바이러스',sub:'혼자 못 늘어나고 세포 안에 숨어 복제한다',items:[
    {k:'virus',s:'D',tags:['빠른 전파'],where:'3스테이지',weak:'숨기 전엔 항체, 숨은 뒤엔 세포독성 T림프구와 NK세포.'},
    {k:'virus',s:'E',tags:['MHC 숨김'],where:'3스테이지',weak:'세포독성 T림프구가 못 알아본다. NK세포가 2배로 강하다.'},
    {k:'mutant',s:'F',tags:['항원 변이','보스'],where:'3스테이지 마지막',weak:'대식세포로 정체를 다시 밝힌 뒤 형질세포와 T림프구로 처리한다.'},
    {k:'infected',s:'D',name:'감염세포',tags:['바이러스 공장'],where:'바이러스가 숨으면 생긴다',weak:'NK세포, 세포독성 T림프구. 그대로 두면 바이러스를 내보내다 터진다.',
     trait:'바이러스가 숨어든 우리 몸 세포. 항체도 식세포도 안쪽까지 닿지 못한다.'}]},
  {row:'무해한 물질',sub:'병원체가 아니다',items:[
    {k:'pollen',s:'P',tags:['무해','알레르기 유발'],where:'2·3스테이지',weak:'싸울 필요가 없다. 감작되면 비만세포가 과민 반응한다.'}]}
];
const BOOK_BODY=[
  {row:'1차 방어선',sub:'감염 전부터 있는 장벽',items:['skin','mucus','lyso','cilia'].map(k=>({b:k,how:'준비 단계에 깐다'}))},
  {row:'선천 면역',sub:'누구든 바로 공격한다. 빠르지만 덜 정확하다',items:[
    {u:'macro',how:'카드로 출동'},{u:'neut',how:'비만세포 경보 때 자동 출동'},{u:'mast',how:'카드로 출동'},
    {u:'serum',how:'비만세포 경보 때 새어 나옴'},{u:'nk',how:'3스테이지부터 카드로 출동'}]},
  {row:'지휘',sub:'적응 면역을 켜는 스위치',items:[{u:'helper',how:'항원 정체가 드러나면 열림'}]},
  {row:'체액성 면역',sub:'항체로 세포 밖 병원체를 처리한다',items:[
    {u:'bcell',how:'항원 정체가 드러나면 열림'},{u:'plasma',how:'B림프구가 분화해 자동 생성'},{u:'memory',how:'같은 유형 10번 처치로 열림'}]},
  {row:'세포성 면역',sub:'감염된 세포를 통째로 없앤다',items:[{u:'tc',how:'바이러스 항원이 드러나면 열림'}]}
];
function makeEnemyIcon(k,s){
  const c=document.createElement('canvas');c.width=80;c.height=80;const g=c.getContext('2d');
  drawWith(g,()=>{const keep=S.revealed[s];S.revealed[s]=1;g.save();const sc=k==='mutant'?.55:k==='infected'?.75:.95;g.translate(40,46);g.scale(sc,sc);
    drawEnemy({id:1,k,s,x:-LEFT/CELL,lane:0,ry:-.46,hp:1,maxhp:1,age:0,opT:0,slowT:0,icon:1},0);g.restore();S.revealed[s]=keep;});
  return c;
}
let bookPage='ag';
function showBook(){
  overlay(`<div class="card bookcard"><div class="eyebrow">면역 도감</div>
    <div class="booktabs"><button class="tab" id="bk-ag" data-p="ag">항원</button><button class="tab" id="bk-body" data-p="body">우리 몸</button></div>
    <div class="bookpage" id="bookPage"></div><button class="btn" id="bookClose">돌아가기</button></div>`);
  document.querySelectorAll('.booktabs .tab').forEach(b=>b.onclick=()=>{bookPage=b.dataset.p;fillBook();});
  $('bookClose').onclick=hideOverlay;fillBook();$('bookClose').focus();
}
function bookRow(row,sub){const r=document.createElement('section');r.className='bookrow';
  r.innerHTML=`<div class="rowhead"><b>${row}</b><span>${sub}</span></div>`;const cards=document.createElement('div');cards.className='rowcards';r.appendChild(cards);return [r,cards];}
function fillBook(){
  document.querySelectorAll('.booktabs .tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===bookPage)));
  const P=$('bookPage');P.innerHTML='';
  if(bookPage==='ag'){
    for(const grp of BOOK_AG){const [r,cards]=bookRow(grp.row,grp.sub);
      for(const it of grp.items){const st=STRAINS[it.s],found=S.revealed[it.s]&&it.k!=='infected';
        const e=document.createElement('div');e.className='entry';e.appendChild(makeEnemyIcon(it.k,it.s));
        const t=document.createElement('div');t.style.minWidth='0';
        t.innerHTML=`<b>${it.name||st.name}${found?' <em class="found">발견</em>':''}</b><div class="tags">${it.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
          <p>${it.trait||st.trait}</p><dl><dt>약점</dt><dd>${it.weak}</dd><dt>등장</dt><dd>${it.where}</dd></dl>`;
        e.appendChild(t);cards.appendChild(e);}
      P.appendChild(r);}
  } else {
    for(const grp of BOOK_BODY){const [r,cards]=bookRow(grp.row,grp.sub);
      for(const it of grp.items){const e=document.createElement('div');e.className='entry';
        let name,desc;
        if(it.b){e.appendChild(makeIcon('barrier',it.b));name=BARRIERS[it.b].name;desc=BARRIERS[it.b].desc;}
        else{e.appendChild(makeIcon('unit',it.u));name=it.u==='serum'?'혈장':UNITS[it.u].name;
          desc=it.u==='serum'?'히스타민으로 넓어진 혈관에서 새어 나오는 액체. 고인 곳에선 병원체가 느려지고, 보체 단백질이 세균에 구멍을 낸다':UNITS[it.u].desc;}
        const cost=it.b?BARRIERS[it.b].cost:(UNITS[it.u]&&UNITS[it.u].cost)||0;
        const t=document.createElement('div');t.style.minWidth='0';
        t.innerHTML=`<b>${name}</b><div class="tags"><span class="tag how">${it.how}</span>${cost?`<span class="tag">포도당 ${cost}</span>`:''}</div><p>${desc}</p>`;
        e.appendChild(t);cards.appendChild(e);}
      P.appendChild(r);}
  }
}

function cellFromEvent(ev){const rect=cv.getBoundingClientRect();let x=(ev.clientX-rect.left)*W/rect.width,y=(ev.clientY-rect.top)*H/rect.height;
  x=CAM.cx+(x-CAM.cx)/CAM.z;y=CAM.cy+(y-CAM.cy)/CAM.z;
  return {c:Math.floor((x-LEFT)/CELL),r:Math.floor(y/CELL),px:(x-LEFT)/CELL,py:(y-50)/CELL};}
cv.addEventListener('pointermove',ev=>{hover=cellFromEvent(ev);});
cv.addEventListener('pointerleave',()=>hover=null);
cv.addEventListener('pointerdown',ev=>{if(S.phase!=='setup'&&S.phase!=='wave')return;const {c,r,px,py}=cellFromEvent(ev);if(c<0||c>=COLS||r<0||r>=ROWS)return;place(c,r,px,py);hover={c,r};refreshTray();});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{setTab(b.dataset.tab);refreshTray();});
$('startBtn').onclick=()=>{if(S.phase!=='setup')return;S.phase='wave';S.t=0;selected=null;setTab('unit');camPunch(W/2,H/2,.05);setInfo('웨이브 시작. 면역세포 카드를 눌러 계속 출동시킨다.');refreshTray();};
$('antiBtn').onclick=()=>{if(S.antiUsed||S.phase!=='wave')return;S.antiUsed=true;
  S.enemies.forEach(e=>{if(e.k==='bact'||e.k==='toxin'){e.dead=1;S.fx.push({x:LEFT+e.x*CELL,y:e.lane*CELL+50,t:0,kind:'pop'});}});
  S.enemies=S.enemies.filter(e=>!e.dead);note('antibiotic');refreshTray();};
$('removeBtn').onclick=()=>{removeMode=!removeMode;selected=null;S.picked=null;$('removeBtn').classList.toggle('sel',removeMode);
  setInfo(removeMode?'지울 세포나 방어선을 누른다. 준비 단계에서 지우면 포도당을 돌려받는다.':DEFAULT_INFO);refreshTray();};
$('bookBtn').onclick=showBook;
$('pyBtn').onclick=()=>{if(!(S.fever>0)||S.antipyUsed)return;S.antipyUsed=true;S.antipyT=S.fever;note('antipy');refreshTray();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;removeMode=false;S.picked=null;$('removeBtn').classList.remove('sel');refreshTray();}});

let last=performance.now(),trayTimer=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const time=now/1000;
  if(S.phase==='wave'&&$('overlay').hidden)update(dt);
  updateCam(dt);render(time);tickToast(dt);
  trayTimer+=dt;if(trayTimer>.2){trayTimer=0;refreshHud();refreshTray();}
  requestAnimationFrame(loop);
}
S=newState(0);
document.fonts.ready.then(()=>{buildTray();refreshHud();});
buildTray();setTab('barrier');showIntro();refreshHud();
requestAnimationFrame(loop);
</script>
</body>
